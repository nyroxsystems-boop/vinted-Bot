<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinted-System · Services</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --muted: #94a3b8;
        --fg: #f1f5f9;
        --brand: #3b82f6;
        --green: #22c55e;
        --red: #ef4444;
        --amber: #f59e0b;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg); color: var(--fg);
        font-size: 13px;
      }
      body { display: flex; flex-direction: column; }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex; align-items: center; justify-content: space-between;
      }
      header h1 { margin: 0; font-size: 15px; font-weight: 600; }
      header .subtitle { color: var(--muted); font-size: 11px; margin-top: 2px; }
      header button {
        background: var(--brand); color: white; border: 0;
        padding: 6px 12px; border-radius: 6px; cursor: pointer;
        font-size: 12px; font-weight: 500;
      }
      header button:hover { filter: brightness(1.1); }
      header button.ghost {
        background: transparent; border: 1px solid var(--border); color: var(--fg);
      }
      header button.danger { background: var(--red); }
      header button.success { background: var(--green); }
      header button:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
      .service-actions {
        display: flex; gap: 4px; margin-top: 6px; margin-left: 16px;
      }
      .service-actions button {
        font-size: 10px; padding: 3px 8px; border-radius: 4px;
        border: 1px solid var(--border); background: transparent; color: var(--fg);
        cursor: pointer;
      }
      .service-actions button:hover { background: var(--card); }
      .service-actions button.start { border-color: #22c55e; color: #86efac; }
      .service-actions button.stop { border-color: #ef4444; color: #fca5a5; }
      .service-actions button:disabled { opacity: 0.3; cursor: not-allowed; }
      main {
        flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 0;
      }
      #services {
        border-right: 1px solid var(--border); overflow-y: auto; padding: 8px;
      }
      .service {
        padding: 10px 12px; border-radius: 8px; margin-bottom: 6px;
        cursor: pointer; transition: background 0.1s;
        border: 1px solid transparent;
      }
      .service:hover { background: var(--card); }
      .service.active { background: var(--card); border-color: var(--border); }
      .service .title { display: flex; align-items: center; gap: 8px; font-weight: 500; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
      .dot.running { background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,.5); }
      .dot.starting { background: var(--amber); animation: pulse 1s infinite; }
      .dot.exited, .dot.failed { background: var(--red); }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
      .service .meta { color: var(--muted); font-size: 11px; margin-top: 3px; margin-left: 16px; }
      #logs-panel { display: flex; flex-direction: column; min-height: 0; }
      #logs-header {
        padding: 10px 16px; border-bottom: 1px solid var(--border);
        display: flex; align-items: center; justify-content: space-between;
        font-size: 12px;
      }
      #logs-header .actions { display: flex; gap: 6px; }
      #logs-header button {
        background: transparent; border: 1px solid var(--border);
        color: var(--fg); padding: 4px 10px; border-radius: 5px;
        cursor: pointer; font-size: 11px;
      }
      #logs-header button:hover { background: var(--card); }
      #logs {
        flex: 1; overflow-y: auto; padding: 10px 14px;
        font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 11px;
        line-height: 1.5;
      }
      .log-line { white-space: pre-wrap; word-break: break-all; }
      .log-line .ts { color: var(--muted); margin-right: 6px; }
      .log-line.stderr { color: #fca5a5; }
      .log-line.info { color: #bae6fd; }
      .log-line.warn { color: #fcd34d; }
      .log-line.error { color: #fca5a5; }
      .empty {
        padding: 24px; text-align: center; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Vinted-System · Services-Konsole</h1>
        <div class="subtitle" id="summary">Initialisiere…</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="ghost" id="btn-update" style="display:none">⬇ Update</button>
        <button class="success" id="btn-start-all">▶ Alle starten</button>
        <button class="danger" id="btn-stop-all">■ Alle stoppen</button>
        <button class="ghost" id="btn-restart-all" title="Nur Services neu starten">↻ Services</button>
        <button class="ghost" id="btn-full-restart" title="App komplett neu starten: git pull + npm install + npm run app:dev">🔄 Update &amp; Neustart</button>
        <button id="btn-open-dashboard">Dashboard öffnen</button>
      </div>
    </header>

    <dialog id="update-modal"
      style="max-width:560px;border-radius:12px;border:1px solid var(--border);padding:0;background:var(--card);color:var(--fg)">
      <div style="padding:20px 24px">
        <h2 style="margin:0 0 4px;font-size:16px">Update verfügbar</h2>
        <div id="update-summary" style="font-size:12px;color:var(--muted);margin-bottom:14px"></div>
        <div id="update-rust-warn"
          style="display:none;padding:10px 12px;background:rgba(245,158,11,.15);border:1px solid var(--amber);border-radius:6px;font-size:12px;margin-bottom:12px">
          ⚠️ Rust-Code hat sich geändert. Nach dem Update musst du die App manuell neu starten
          (Cmd+Q, dann <code>npm run app:dev</code>).
        </div>
        <div id="update-uncommitted-warn"
          style="display:none;padding:10px 12px;background:rgba(239,68,68,.15);border:1px solid var(--red);border-radius:6px;font-size:12px;margin-bottom:12px">
          Lokale, uncommittete Änderungen blockieren das Update. Committe oder verwirf sie zuerst.
        </div>
        <div id="update-commits"
          style="max-height:220px;overflow-y:auto;font-family:'SF Mono',Menlo,monospace;font-size:11px;background:var(--bg);padding:10px;border-radius:6px;margin-bottom:14px"></div>
        <div id="update-progress"
          style="display:none;padding:10px 12px;background:var(--bg);border-radius:6px;font-size:12px;margin-bottom:12px"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button id="btn-update-cancel"
            style="background:transparent;border:1px solid var(--border);color:var(--fg);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:12px">
            Später
          </button>
          <button id="btn-update-apply"
            style="background:var(--green);color:white;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500">
            Update anwenden
          </button>
        </div>
      </div>
    </dialog>
    <main>
      <aside id="services"></aside>
      <section id="logs-panel">
        <div id="logs-header">
          <span id="logs-title">Logs</span>
          <div class="actions">
            <button id="btn-filter-all">Alle</button>
            <button id="btn-filter-err">Nur Fehler</button>
            <button id="btn-clear">Leeren</button>
          </div>
        </div>
        <div id="logs"><div class="empty">Warte auf Log-Output…</div></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
