[package]
name = "vinted-system-app"
version = "0.1.0"
description = "Vinted-System: lokale Mac-App mit Services-Konsole"
authors = ["nyroxsystems-boop"]
edition = "2021"

[lib]
name = "vinted_system_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Tarball updater: HTTP fetch, sha-256 integrity check, Ed25519 signature
# verification, and tar/gzip extraction. Kept minimal to stay under the
# release-build size budget.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
sha2 = "0.10"
ed25519-dalek = "2"
flate2 = "1"
tar = "0.4"
hex = "0.4"

# SQLite read-only helper. Used by the supervisor to hydrate API keys from
# the orchestrator's settings table into each spawned bot's env, and to gate
# bot startup on `<marketplace>_enabled = true`. `bundled` links in the
# amalgamated SQLite source so we don't depend on whatever sqlite version
# the host has — same behaviour on every CI build.
rusqlite = { version = "0.32", features = ["bundled"] }

# Unix signal handling — SIGTERM/SIGINT/SIGHUP cleanup of supervised children.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
