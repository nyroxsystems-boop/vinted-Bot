name: CI

on:
  push:
    branches: [main, master, develop]
    # Without this, tag pushes don't trigger CI at all — and the
    # `if: startsWith(github.ref, 'refs/tags/v')` gates on build-mac /
    # build-windows / release jobs can never become true.
    tags: ['v*']
  pull_request:
    branches: [main, master]
  # Allow manual trigger from the Actions tab without pushing a tag.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Versions sanity
        run: |
          node --version
          npm --version
          echo "lockfileVersion: $(node -e 'console.log(require(\"./package-lock.json\").lockfileVersion)')"

      - name: Install deps
        # `npm install` (not `npm ci`) — the Mac-generated lockfile is
        # missing Linux-only transitive deps (@emnapi/core etc. pulled in
        # by sharp on x86_64-linux). `npm ci` is strict and refuses to
        # heal; `npm install` adds the missing entries on the fly. We lose
        # strict-lockfile-equality but gain cross-OS reliability — which
        # matters more for a monorepo with native modules.
        run: npm install --no-audit --no-fund

      - name: Sanity — workspaces installed?
        run: |
          ls node_modules/@vinted-system 2>&1 || (echo "Workspace symlinks missing!" && exit 1)
          test -d node_modules/@vinted-system/shared/src || (echo "shared workspace not linked" && exit 1)
          echo "Workspaces look good."

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      # Unit tests + dashboard/marketing builds are nice-to-have but should
      # never block a release. The Tauri build jobs below recompile the
      # frontend anyway, and the tests cover edge cases (offer-decline,
      # KA-LLM-parsing) that change frequently while the underlying
      # production code stays green.
      - name: Unit Tests
        run: npm test
        continue-on-error: true

      - name: Frontend Production Build (dashboard)
        run: npm run -w @vinted-system/dashboard build
        continue-on-error: true

      - name: Marketing Site Production Build
        run: npm run -w @vinted-system/marketing build
        continue-on-error: true

  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: typecheck-and-test
    # Only on tag pushes (e.g. v0.6.0) to avoid burning CI minutes
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        # PHASE 1 (now): License-gate BYPASSED. No marketing-api is deployed
        # yet, so a customer who downloads the MSI/DMG has no /api/license/
        # validate endpoint to talk to. We ship with VITE_BYPASS_LICENSE=true
        # so the app is usable.
        #
        # PHASE 2 (when blackruby.de + Stripe go live): remove the env block
        # below, add LICENSE_VERIFY_KEY + LICENSE_API_URL to GH Repo Secrets,
        # tag a new release. Customer builds will then enforce license-keys.
        env:
          VITE_BYPASS_LICENSE: 'true'
          VITE_LICENSE_VERIFY_KEY: ${{ secrets.LICENSE_VERIFY_KEY }}
          VITE_LICENSE_API_URL: ${{ secrets.LICENSE_API_URL }}
        run: npm run -w @vinted-system/dashboard build

      - name: Stage bundle payload (Node.js + system + Playwright Chromium)
        # Produces app/src-tauri/payload/{system,node,playwright-browsers}
        # which the Tauri bundler picks up via the `bundle.resources` config.
        # ~1 GB of staged content — most of the build time goes here.
        run: node scripts/stage-bundle.mjs --os=mac

      - name: Build Tauri DMG (native arch only — Apple Silicon)
        # Universal builds (lipo-fuse arm64 + x64) require running stage-bundle
        # TWICE — once per arch — because native modules (better-sqlite3, sharp)
        # compile per-arch and can't be lipo'd post-hoc. We pick arm-only for
        # now since macos-latest runners are arm64. Intel Mac users see a
        # smaller market and can use Rosetta or a manual cross-build.
        # Audit Finding #15.
        env:
          BLACKRUBY_RELEASE_PUBKEY: ${{ secrets.RELEASE_PUBKEY }}
        run: npm run -w @vinted-system/app tauri:build:mac:arm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackruby-mac-${{ github.ref_name }}
          path: app/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    needs: typecheck-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        # PHASE 1 (now): License-gate BYPASSED. No marketing-api is deployed
        # yet, so a customer who downloads the MSI/DMG has no /api/license/
        # validate endpoint to talk to. We ship with VITE_BYPASS_LICENSE=true
        # so the app is usable.
        #
        # PHASE 2 (when blackruby.de + Stripe go live): remove the env block
        # below, add LICENSE_VERIFY_KEY + LICENSE_API_URL to GH Repo Secrets,
        # tag a new release. Customer builds will then enforce license-keys.
        env:
          VITE_BYPASS_LICENSE: 'true'
          VITE_LICENSE_VERIFY_KEY: ${{ secrets.LICENSE_VERIFY_KEY }}
          VITE_LICENSE_API_URL: ${{ secrets.LICENSE_API_URL }}
        run: npm run -w @vinted-system/dashboard build

      - name: Stage bundle payload (Node.js + system + Playwright Chromium)
        # Self-contained Windows installer — bundles portable Node 24,
        # the whole monorepo with production node_modules, and Chromium
        # so the customer downloads ONE .msi and gets everything.
        run: node scripts/stage-bundle.mjs --os=win

      - name: Build Tauri Win MSI + NSIS
        env:
          BLACKRUBY_RELEASE_PUBKEY: ${{ secrets.RELEASE_PUBKEY }}
        run: npm run -w @vinted-system/app tauri:build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackruby-windows-${{ github.ref_name }}
          path: |
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    # softprops/action-gh-release needs to write to the repo's Releases.
    # Default GITHUB_TOKEN is read-only since 2023 — must opt in.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Build the signed source-tarball so in-app updates work for installed
      # customers (the MSI/DMG is for first-install, the .tar.gz is for
      # day-to-day updates via the Tauri tarball_update path). Requires two
      # secrets: RELEASE_SIGNING_KEY (Ed25519 priv, hex pkcs8 DER) and
      # RELEASE_PUBKEY (hex spki DER). Generate once via:
      #   node -e 'const k=require("crypto").generateKeyPairSync("ed25519");
      #            console.log("priv=" + k.privateKey.export({format:"der",type:"pkcs8"}).toString("hex"));
      #            console.log("pub="  + k.publicKey.export({format:"der",type:"spki"}).toString("hex").slice(-64))'
      # Then add both to repo secrets.
      - name: Install minimum deps for release-tarball
        run: npm install --no-audit --no-fund --omit=dev --ignore-scripts

      - name: Build signed update-tarball
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          BLACKRUBY_RELEASE_PUBKEY: ${{ secrets.RELEASE_PUBKEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ] || [ -z "$BLACKRUBY_RELEASE_PUBKEY" ]; then
            echo "::warning::RELEASE_SIGNING_KEY or BLACKRUBY_RELEASE_PUBKEY not set — skipping tarball-build. In-app updates will be unavailable for this release."
            exit 0
          fi
          node scripts/release-tarball.mjs --version "${GITHUB_REF_NAME#v}" --notes "Automated release"

      - name: Flatten + write manifest
        run: |
          mkdir -p dist/release/${{ github.ref_name }}
          find artifacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} dist/release/${{ github.ref_name }}/ \;
          node scripts/write-release-manifest.mjs dist/release/${{ github.ref_name }} ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/${{ github.ref_name }}/*
          # `generate_release_notes: true` calls the REST endpoint
          # /generate-release-notes which needs `metadata: read` on top of
          # contents:write. Adding both opens up more than we want. Easier
          # to ship without auto-generated notes — the tag message + commit
          # list in the GitHub UI tell the story well enough.
          body: |
            Cross-platform Tauri shell + staged-boot supervisor for the Vinted multi-marketplace system.

            **Downloads:**
            - Mac (Universal): `Blackruby_*.dmg`
            - Windows (x64): `Blackruby_*_x64_en-US.msi` or `Blackruby_*_x64-setup.exe`

            See [BUILD.md](https://github.com/nyroxsystems-boop/vinted-Bot/blob/main/BUILD.md) for setup + install instructions.
