name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Unit Tests
        run: npm test

      - name: Frontend Production Build (dashboard)
        run: npm run -w @vinted-system/dashboard build

      - name: Marketing Site Production Build
        run: npm run -w @vinted-system/marketing build
        continue-on-error: false

  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: typecheck-and-test
    # Only on tag pushes (e.g. v0.6.0) to avoid burning CI minutes
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build dashboard
        run: npm run -w @vinted-system/dashboard build

      - name: Build Tauri DMG (universal)
        run: npm run -w @vinted-system/app tauri:build:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackruby-mac-${{ github.ref_name }}
          path: app/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    needs: typecheck-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build dashboard
        run: npm run -w @vinted-system/dashboard build

      - name: Build Tauri Win MSI + NSIS
        run: npm run -w @vinted-system/app tauri:build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackruby-windows-${{ github.ref_name }}
          path: |
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + write manifest
        run: |
          mkdir -p dist/release/${{ github.ref_name }}
          find artifacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} dist/release/${{ github.ref_name }}/ \;
          node scripts/write-release-manifest.mjs dist/release/${{ github.ref_name }} ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/${{ github.ref_name }}/*
          generate_release_notes: true
